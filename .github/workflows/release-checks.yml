name: Release checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-database-only
          POSTGRES_DB: fixture
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U fixture" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: court-assist-backend
    env:
      APP_ENV: testing
      JWT_SECRET_KEY: test-only-github-actions-signing-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: court-assist-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Verify migration and concurrent payment on PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://fixture:fixture-database-only@127.0.0.1:5432/fixture
          DATABASE_URL: postgresql+psycopg://fixture:fixture-database-only@127.0.0.1:5432/fixture
        run: |
          alembic upgrade head
          python -m pytest -q tests/test_release_postgres.py
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: court-assist-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: court-assist-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npx expo export --platform android --output-dir dist-check
        env:
          COURT_ASSIST_RELEASE: '1'
          EXPO_PUBLIC_API_URL: https://api.courtassist.example

